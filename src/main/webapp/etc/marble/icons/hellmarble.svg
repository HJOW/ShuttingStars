<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hellmarble</title>
  <desc id="desc">청록색 바탕에 크림색과 금색 주사위 두 개가 놓인 보드게임 아이콘</desc>
  <rect width="512" height="512" fill="#0f766e"/>
  <!-- 일반 아이콘은 그림을 확대한다. maskable 변형에서는 이 확대를 제거해 중심 반지름 40%의 안전 영역을 지킨다. -->
  <g id="dice" transform="translate(-51.2 -51.2) scale(1.2)" stroke-linejoin="round">
    <g transform="rotate(-12 210 204)">
      <rect x="138" y="143" width="144" height="144" rx="28" fill="#064e49"/>
      <rect x="138" y="132" width="144" height="144" rx="28" fill="#fffdf7"/>
      <g fill="#174b46">
        <circle cx="178" cy="172" r="13"/>
        <circle cx="242" cy="172" r="13"/>
        <circle cx="210" cy="204" r="13"/>
        <circle cx="178" cy="236" r="13"/>
        <circle cx="242" cy="236" r="13"/>
      </g>
    </g>
    <g transform="rotate(12 302 306)">
      <rect x="230" y="245" width="144" height="144" rx="28" fill="#064e49"/>
      <rect x="230" y="234" width="144" height="144" rx="28" fill="#f6c453"/>
      <g fill="#584319">
        <circle cx="270" cy="274" r="14"/>
        <circle cx="302" cy="306" r="14"/>
        <circle cx="334" cy="338" r="14"/>
      </g>
    </g>
  </g>
</svg>
