    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>서비스 이용 안내</title>
        <style>
            :root {
                color-scheme: light;
                font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
                color: #202124;
                background: #fff;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 32px 20px;
                background: #fff;
            }

            .notice {
                position: absolute;
                top: 40%;
                width: min(100%, 560px);
                text-align: center;
            }

            .notice-mark {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 48px;
                height: 48px;
                margin-bottom: 24px;
                border: 2px solid currentColor;
                border-radius: 50%;
                font-size: 24px;
                font-weight: 700;
            }

            h1 {
                margin: 0;
                font-size: clamp(24px, 5vw, 32px);
                letter-spacing: -0.04em;
            }

            p {
                margin: 16px 0 0;
                color: #5f6368;
                font-size: 15px;
                line-height: 1.8;
                word-break: keep-all;
            }

            body.dark {
                color-scheme: dark;
                color: #f5f7ff;
                background: #0e1220;
                min-height: 9999px;
                overflow: hidden;
            }

            body.dark .notice {
                padding: 56px 40px;
                border: 1px solid rgba(166, 180, 255, 0.24);
                border-radius: 24px;
                background: linear-gradient(145deg, #1b2340, #111728);
                box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
            }

            body.dark .notice-mark {
                color: #b9c4ff;
                border-color: #7181e8;
            }

            body.dark p {
                color: #bbc4de;
            }

            @media (max-width: 480px) {
                body.dark .notice {
                    padding: 44px 24px;
                }
            }
        </style>
    </head>
    <body>
        <main class="notice" role="main">
            <div class="notice-mark" aria-hidden="true">!</div>
            <h1>서비스를 잠시 이용할 수 없습니다</h1>
            <p>현재 서비스 점검 또는 일시적인 문제로 이용이 어렵습니다.<br/>잠시 후 다시 접속해 주세요.</p>
        </main>
    </body>
</html>
