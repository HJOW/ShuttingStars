        <!-- Google Ads 관련 (없어도 게임은 동작함) -->
        <script src="//imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.13.0/firebase-database-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.13.0/firebase-messaging-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.13.0/firebase-remote-config-compat.js"></script>
        <script type="text/javascript" src="https://www.gstatic.com/firebasejs/12.13.0/firebase-performance-compat.js"></script>
        <script defer src="/__/firebase/init.js?useEmulator=true"></script>
        <!-- // Google Ads 관련 -->

        <!-- manifest (이 webmanifest 가 있어야 PWA 앱으로도 설치할 수 있음, 없어도 게임 자체는 동작함) -->
        <link rel="manifest" href="manifest.webmanifest"/>

        <!-- Game 관련 (선택) -->
        <script defer src="./js/ort.all.min.js"></script>
        <!-- // Game 관련 (선택) -->

        <!-- Game 관련 (필수) -->
        <link rel="stylesheet" href="./css/puyow.css"/>
		<script type="importmap">{ "imports": { "./js/three.core.js": "./js/three.core.min.js" } }</script>
        <script type="module" src="./js/puyow_3d.js"></script>
        <script type="module" src="./js/puyow.js"></script>
        <!-- // Game 관련 -->

        <!-- 게임 로딩 스크립트 -->
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const divTarget = document.getElementById("puyow_target");
                // 공지사항 경로 설정
				window.PuyoW.setNoticeFile('https://hjow.github.io/puyow/src/notice/notice_[LANG].txt');

                // FIREBASE 초기화 (선택 사항)
                let analytics   = null;
                let performance = null;
                try { analytics   = firebase.analytics();   } catch(e) { console.error('Firebase Analytics 초기화 중 오류가 발생했습니다.', e); }
                try { performance = firebase.performance(); } catch(e) { console.error('Firebase Performance 초기화 중 오류가 발생했습니다.', e); }
                window.PuyoW.setFirebaseServices(analytics, performance);

                // 게임 구동
                window.PuyoW.initialize(divTarget);
            });
        </script>
    </head>
    <body class="webpuyo">
        <div id="puyow_target" width="1280" height="720" aria-label="Web Puyo puzzle game"></div>
    </body>
</html>
