<script type="module">
import { ShuttingStarsUtility, SSUtil, BrowserDetector, BpmDetector  } from '../resources/js/shuttingstarsutils.js'
import { ShuttingStars, ShuttingStarsSong, CustomSSSong, SSNote, SSLongNote } from '../resources/js/shuttingstars.js';

/* 페이지 접속 시 호출 */
window.addEventListener('DOMContentLoaded', function() {
    const root = document.querySelector('.shuttingstar_root');
    let coreInst = null;
    ShuttingStars.setBeforeInitializeHook(function(broker) {
        broker.apply({
            createMode : true,
            fOuterWidth : function() { return  720;  },
            fOuterHeight : function() { return 1280; },
            urlCtx : '../'
        });
    });
    ShuttingStars.setAfterInitializeHook(function(broker, coreInstance) {
        coreInst = coreInstance;
        let idx;

        document.querySelector('.shuttingstars_root .shuttingstars_canvas').style.position = 'relative';
        
        const dLoad = document.querySelector('.shuttingstars_create_loadings');
        const pLoad     = dLoad.querySelector('progress');
        const ta        = document.querySelector('.ta_song_json');
        const selSongs  = document.querySelector('.sel_songs');
        const selDiff   = document.querySelector('.sel_diff');
        const inpElps   = document.querySelector('.inp_elapsedTime');
        const btnLoad   = document.querySelector('.btn_load');
        const btnSave   = document.querySelector('.btn_save');
        const btnSaveAs = document.querySelector('.btn_save_as');
        const btnTest   = document.querySelector('.btn_test');
        const btnStop   = document.querySelector('.btn_stop');
        const btnPaus   = document.querySelector('.btn_pause');
        const btnRsum   = document.querySelector('.btn_resume');
        const btnDiffRe = document.querySelector('.btn_diff_ref');
        const btnAutoNt = document.querySelector('.btn_autonote');
        const audioControls = document.querySelector('.td_audio_controls');

        const appendOption = function(select, value, label) {
            const option = document.createElement('option');
            option.value = value;
            option.textContent = label;
            select.append(option);
        };

        let songSelected = null;

        const fLoadSongList = function() {
            selSongs.replaceChildren();
            selDiff.replaceChildren();
            btnTest.disabled = true;
            btnStop.disabled = true;
            btnAutoNt.disabled = true;
            appendOption(selSongs, '', '- NEW -');
            for(idx=0; idx<broker.songs.length; idx++) {
                const songOne = broker.songs[idx];
                if(songOne.serial == '') continue;
                appendOption(selSongs, songOne.serial, songOne.name);
            }

            dLoad.hidden = true;
        }

        const fLoadDiffList = function(loadJson) {
            if(songSelected == null) return;

            if(loadJson) {
                let text = ta.value;
                let songConverted = null;
                try {
                    let json = ShuttingStarsUtility.parseJSON(text);
                    songConverted = broker.parseSong(json);
                } catch(e) {
                    console.error(e);
                    alert('ERROR : ' + e);
                    return;
                }

                if(songConverted.difficulties) {
                    songSelected.difficulties = songConverted.difficulties;
                }
            }

            selDiff.replaceChildren();
            for(idx=0; idx<songSelected.difficulties.length; idx++) {
                let diffOne = songSelected.difficulties[idx];
                diffOne.index = idx;
                appendOption(selDiff, idx, diffOne.difficultyLabel + ' (' + diffOne.difficultyLevel + ')');
            }
            if(songSelected.difficulties.length >= 1) { selDiff.disabled = false; btnTest.disabled = false; btnAutoNt.disabled = false; }
            else { selDiff.disabled = true; btnTest.disabled = true; btnAutoNt.disabled = true; }
        }

        const fLoadSong = function() {
            selDiff.replaceChildren();
            btnTest.disabled = true;
            btnStop.disabled = true;
            btnPaus.disabled = true;
            btnRsum.disabled = true;
            btnDiffRe.disabled = true;
            btnAutoNt.disabled = true;
            inpElps.disabled = true;

            let song = null;
            let songSerial = selSongs.value;
            let newSong = false;
            if(songSerial == '') newSong = true;

            if(newSong) {
                song = new CustomSSSong();
                song.difficulties.push({
                    index : 0,
                    difficultyLabel : 'easy',
                    difficultyLevel : 1,
                    patterns : []
                });
            } else {
                for(idx=0; idx<broker.songs.length; idx++) {
                    const songOne = broker.songs[idx];
                    if(songOne.serial == songSerial) {
                        song = songOne;
                        break;
                    }
                }
            }

            if(song == null) { alert('Failed to load this song !'); fLoadSongList(); return; }
            songSelected = song;

            ta.value = JSON.stringify(songSelected.toJSONObject(), null, 4);

            fLoadDiffList(false);

            if(newSong) {
                btnSave.disabled = false;
                btnSaveAs.disabled = true;
            } else if(coreInst.officialSongSerials.indexOf(songSerial) >= 0) {
                btnSave.disabled = true;
                btnSaveAs.disabled = false;
            } else {
                btnSave.disabled = false;
                btnSaveAs.disabled = false;
            }
            btnDiffRe.disabled = false;
        }

        const fSaveSong = function(saveAs) {
            let text = ta.value;
            let songConverted = null;
            let newSongYn = false;
            try {
                let json = ShuttingStarsUtility.parseJSON(text);

                newSongYn = (json.serial == '');
                if(saveAs) { json.serial = ''; json.description += '\nCOPIED !'; newSongYn = true; }

                songConverted = broker.parseSong(json);
            } catch(e) {
                console.error(e);
                alert('ERROR : ' + e);
                return;
            }

            if(newSongYn) { // 신규 작성 곡인 경우
                songConverted = broker.addSong(songConverted); 
                let newSerial = songConverted.serial;
                fLoadSongList();
                selSongs.value = newSerial;
            } else { // 기존 곡인 경우
                if(broker.officialSongSerials.indexOf(songConverted.serial) >= 0) { alert('Cannot modify official songs !'); return; }
                let beforeSongIdx = null;

                for(idx=0; idx<broker.songs.length; idx++) {
                    const songOne = broker.songs[idx];
                    if(songOne.serial == songConverted.serial) {
                        beforeSongIdx = idx;
                        break;
                    }
                }

                broker.setSongOne(songConverted, beforeSongIdx);
                fLoadSongList();
                selSongs.value = songConverted.serial;
            }
            fLoadSong();
        }

        const fTest = function() {
            btnTest.disabled = true;
            btnLoad.disabled = true;
            btnSave.disabled = true;
            btnPaus.disabled = false;
            btnRsum.disabled = true;
            btnDiffRe.disabled = true;
            btnAutoNt.disabled = true;
            inpElps.disabled = true;

            let text = ta.value;
            let songConverted = null;
            try {
                songConverted = broker.parseSong(text);
            } catch(e) {
                console.error(e);
                alert('ERROR : ' + e);
                return;
            }

            let diff = selDiff.value;

            if(songConverted.serial == '') { // 신규 작성 곡인 경우 - 곡 등록해서 시리얼 발급해야 함
                fSaveSong(false);
                selDiff.value = diff;
            }

            broker.setSong(songConverted);
            broker.setDifficultyChoosingList(songConverted.getDifficultyList());
            broker.setDifficultyIndex(diff);
            broker.prepareCreateModeSong();
            setTimeout(function() {
                if(coreInst.audio != null) {
                    audioControls.replaceChildren(coreInst.audio);
                    coreInst.audio.controls = true;
                    // coreInst.audio.preload = 'metadata';
                    coreInst.audio.addEventListener('play', fResume);
                    coreInst.audio.addEventListener('pause', fPause);
                    coreInst.audio.addEventListener('ended', fPause);
                }

                btnStop.disabled = false;
            }, 2000);
        }


        const fStop = function() {
            btnStop.disabled = true;
            btnTest.disabled = false;
            btnLoad.disabled = false;
            btnSave.disabled = false;
            btnPaus.disabled = true;
            btnRsum.disabled = true;
            btnAutoNt.disabled = false;
            btnDiffRe.disabled = false;
            inpElps.disabled = true;
            broker.stopSong();
            audioControls.replaceChildren();
        }

        const fPause = function() {
            btnPaus.disabled = true;
            btnRsum.disabled = false;
            inpElps.disabled = false;
            coreInst.pauseSong();
        }

        const fResume = function() {
            let valueElps = inpElps.value;
            btnPaus.disabled = false;
            btnRsum.disabled = true;
            inpElps.disabled = true;
            if(isNaN(valueElps)) valueElps = 0;
            valueElps = parseFloat(valueElps);

            if(coreInst.audio) {
                const newTime = Math.floor((valueElps + coreInst.songTiming) / ((coreInst.song.bpm / 60.0) * (coreInst.timeMultiplier * coreInst.elapsedTimeMultiplier)));
                coreInst.audio.currentTime = newTime;
            }
            coreInst.elapsedTime = valueElps;
            coreInst.elapsedTimeOld = valueElps;

            // coreInst.resumeSong();
            coreInst.resumingTime = 0;
            coreInst.paused = false;
            coreInst.resumed = false;

            if(coreInst.audio) {
                coreInst.audio.play();
            }

            if(coreInst.videoBga) {
                if(coreInst.videoBgaUrl) coreInst.videoBga.play();
            }
        }

        const fAutoNote = async function() {
            const urls  = coreInst.convertURL(songSelected.musicUrl);
            const diff = selDiff.value;

            broker.setSong(songSelected);
            broker.setDifficultyChoosingList(songSelected.getDifficultyList());
            broker.setDifficultyIndex(diff);

            dLoad.hidden = false;

            let bpm = 100;
            if(songSelected.bpm) bpm = songSelected.bpm;
            else { try { bpm = await BpmDetector.detect(urls); } catch(e) { console.error(e); } }

            let diffObj = {};
            let diffIdx = -1;
            for(let ddx=0; ddx<songSelected.difficulties.length; ddx++) {
                const diffOne = songSelected.difficulties[ddx];
                if(diffOne.index == parseInt(diff)) {
                    diffObj = diffOne;
                    diffIdx = ddx;
                    break;
                }
            }

            let notes = null;
            try {

                pLoad.value = 0;
                notes = await coreInst.createAutoNotes(urls, bpm, coreInst.difficultyLevel, function(percent, val, max) {
                    pLoad.max = max;
                    pLoad.value = val;
                    console.log( val + ' / ' + max  + ' (' + percent + '%)');
                });

                diffObj.autoCreate = false;
                diffObj.patterns = [];
                for(let ndx=0; ndx<notes.length; ndx++) {
                    const noteOne = notes[ndx];
                    let noteJson = {
                        index : ndx,
                        time : noteOne.originalTiming,
                        locationIndex : noteOne.locationIndex
                    };
                    if(noteOne instanceof SSLongNote) {
                        noteJson.type = 'long';
                        noteJson.ends = noteOne.originalEndTiming;
                    }
                    diffObj.patterns.push(noteJson);
                }

                songSelected.difficulties[diffIdx] = diffObj;

                pLoad.removeAttribute('value');
                ta.value = JSON.stringify(songSelected.toJSONObject(), null, 4);
            } catch(e) {
                console.error(e);
                alert('ERROR : ' + e);
            }
            
            dLoad.hidden = true;
        };

        btnLoad.addEventListener('click', fLoadSong);
        btnSave.addEventListener('click', function() { fSaveSong(false); });
        btnSaveAs.addEventListener('click', function() { fSaveSong(true); });
        btnTest.addEventListener('click', fTest);
        btnStop.addEventListener('click', fStop);
        btnPaus.addEventListener('click', fPause);
        btnRsum.addEventListener('click', fResume);
        btnDiffRe.addEventListener('click', function() { fLoadDiffList(true); });
        btnAutoNt.addEventListener('click', fAutoNote);

        const fResize = function() {
            document.querySelector('.heightresizetarget').style.height = (window.outerHeight - 250) + 'px';
        }

        window.addEventListener('resize', fResize);
        fResize();
        
        fLoadSongList();
        fLoadSong();

        ShuttingStarsUtility.repeat(() => {
            if(coreInst == null) return;
            if(coreInst.paused) return;
            inpElps.value = coreInst.elapsedTime;
        }, 16);
    });
    ShuttingStars.init(root);
});
</script>

<body>
    <div class='shuttingstar_create_root'>
        <h1>Shutting Stars - Song Creation Mode</h1>
        <table class="full">
            <colgroup>
                <col/>
                <col style="width: 280px;"/>
                <col style="width: 320px;"/>
                <col style="width: 360px;"/>
            </colgroup>
            <tbody>
                <tr>
                    <td>
                        <select class="sel sel_songs"></select>
                        <button type="button" class="btn btn_load">LOAD</button>
                        <button type="button" class="btn btn_save">SAVE</button>
                        <button type="button" class="btn btn_save_as" disabled="disabled">SAVE AS...</button>
                    </td>
                    <td>
                        <button type="button" class="btn btn_diff_ref" disabled="disabled">REFRESH</button>
                        <select class="sel sel_diff" disabled="disabled"></select>
                        <button type="button" class="btn btn_autonote" disabled="disabled">AUTONOTE</button>
                        <button type="button" class="btn btn_test" disabled="disabled">TEST</button>
                        <button type="button" class="btn btn_stop" disabled="disabled">STOP</button>
                    </td>
                    <td>
                        <input type="number" step="0.01" min="0" class="inp inp_elapsedTime" disabled="disabled"/>
                        <button type="button" class="btn btn_pause" disabled="disabled">PAUSE</button>
                        <button type="button" class="btn btn_resume" disabled="disabled">RESUME</button>
                    </td>
                    <td class="td_audio_controls">

                    </td>
                </tr>
                <tr>
                    <td style="vertical-align: top;" colspan="2">
                        <wc-monaco-editor class="full ta_song_json heightresizetarget" language="json"></wc-monaco-editor>
                        <!-- If you want to remove wc-monaco-editor, then put following textarea instead. -->
                        <!-- <textarea class="full ta_song_json heightresizetarget"></textarea> -->
                    </td>
                    <td style="width:720px; max-width: 720px; overflow: hidden;" colspan="2"><div class='shuttingstar_root heightresizetarget'></div></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="shuttingstars_create_loadings" style="z-index: 2000; position: fixed; width: 100%; height: 9999px; overflow: hidden; top: 0px; left: 0px; background-color: rgba(100, 100, 100, 0.5); text-align: center;">
        <progress style="margin-top: 400px;" max="100"></progress>
    </div>
