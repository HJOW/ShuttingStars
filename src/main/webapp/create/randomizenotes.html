<script type="text/javascript">
$(function(){
    const root = $('.shuttingstars_randomizenotes_root');
    const taBef = root.find('.ta_before');
    const taAft = root.find('.ta_after');
    const btnRun = root.find('.btn_randomize');

    btnRun.on('click', function() {
        try {
            taAft.val('[');

            let text = taBef.val();
            let json = JSON.parse(text);
            let lastTime = 0;
            let lastIndex = 0;
            let createdIndex = 0;
            let loops = 0;
            for(let idx=0; idx<json.length; idx++) {
                const rowOne = json[idx];

                createdIndex = Math.floor(ShuttingStarsUtility.random() * 5.9999);
                if(lastIndex == createdIndex) {
                    createdIndex = Math.floor(ShuttingStarsUtility.random() * 5.9999);
                    loops = 0;
                    while(lastIndex == createdIndex && lastTime == rowOne.time) { createdIndex = Math.floor(ShuttingStarsUtility.random() * 5.9999); loops++; if(loops >= 6) break; }
                }
                rowOne.locationIndex = createdIndex;

                taAft.val(taAft.val() + '\n' + '{"locationIndex":' + rowOne.locationIndex + ',"time":' + rowOne.time + "}" + (idx == json.length - 1 ? '' : ','));
                lastIndex = rowOne.locationIndex;
                lastTime = rowOne.time;
            }
            taAft.val(taAft.val() + '\n]');
        } catch(e) {
            console.error(e);
            taAft.val('ERROR : ' + e);
        }
    });

    const fResize = function() {
        $('.heightresizetarget').height((window.outerHeight - 250) + 'px');
    }

    $(window).on('resize', fResize);
    fResize();
});
</script>

<body>

        <table class="full">
            <tbody>
                <tr>
                    <td colspan="2">
                        <button type="button" class="btn btn_randomize">RANDOMIZE</button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <textarea class="ta_before full heightresizetarget"></textarea>
                    </td>
                    <td>
                        <textarea class="ta_after full heightresizetarget" readonly></textarea>
                    </td>
                </tr>
