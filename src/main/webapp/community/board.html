  <body>
    <!--
    Firestore community board implementation notes
        (전제조건) 이 소스는 Firebase Hosting 에 올라갈 예정이며, 상위 디렉토리의 __ 폴더 안에 Firebase 라이브러리가 자동 배치됨. (init.js 안에 Firebase API로 초기화하는 소스도 자동 생성될 예정)
        (참고자료) Firestore 내 board 컬렉션의 필드 구성
            boardName  (string)  - 게시판의 이름으로, 지금은 그냥 board 라고 하드코딩 (추후 다른 목적의 게시판 만들 때 이 값만 다른 값으로 지정해 사용할 예정)
            content    (string)  - 글 내용, 1000자까지 입력 허용 예정
            email      (string)  - 이메일 (글 작성자의 구글 로그인한 계정의 이메일)
            postserial (string)  - 글을 식별할 수 있는 고유값 (랜덤하게 생성하나, 절대 겹쳐서는 안됨)
            regdate    (int)     - 글 작성일 (Date 의 time 값으로 지정)
            uid        (string)  - Firebase authentication 의 계정 고유값 (글 작성자)
            notice     (boolean) - 공지사항 여부 (true 이면, 다른 글보다 무조건 상위에 위치 + 배경식이 약간 다르게 출력되어 강조 표시)
        1. Firebase authentication 으로 로그인 체크, 안되어 있으면 구글 로그인 (shuttingstarsinterface.js 에 일부 구현되어 있음)
        2. 구글 로그인이 되어있으면 바로 글 목록 화면 출력, 맨 상단 우측에는 글 작성 버튼 배치하고, 아래로 글 목록이 출력되어야 함.
           글 목록을 최근 순으로 20개까지 출력, 20개 밑까지 내리면 그다음 20개를 불러오는 방식으로 글 목록 출력
           글은 제목 없이 내용으로만 구성. 개별 글들은 상세페이지 없이, 목록 화면 내에서 글 내용과 수정/삭제 버튼으로 구성.
           글 수정 버튼은 작성자 본인에게만 보여야 하며, 글 삭제 버튼은 작성자 본인 혹은 계정 이메일이 hujinone11@gmail.com  (관리자) 인 경우에만 보여야 함.
        3. 글 작성 화면은 글 목록 화면 위에 겹쳐서 출력, 메시지 내용과, 현재 입력한 내용 길이, 저장 및 취소 버튼으로 구성
           저장 버튼 클릭 히 글이 Firestore 에 등록 후 목록 화면으로, 취소 버튼 클릭 시 그냥 목록 화면으로 이동
           글 수정 화면도 마찬가지

    -->
    <main id="board_root" class="board_root" aria-busy="false">
        <header class="board_top">
            <div>
                <h1 class="board_title">Community Board</h1>
                <p id="board_account" class="board_account"></p>
            </div>
            <div id="board_app_actions" class="board_actions">
                <button id="board_write_button" class="board_btn primary" type="button">글 작성</button>
                <button id="board_logout_button" class="board_btn" type="button">로그아웃</button>
            </div>
        </header>

        <div id="board_status" class="board_status" role="status" aria-live="polite"></div>

        <section id="board_login_panel" class="board_login hidden">
            <p id="board_login_desc">게시판을 이용하려면 Google 로그인이 필요합니다.</p>

            <button id="board_login_button" class="gsi-material-button" type="button">
                <div class="gsi-material-button-state"></div>
                <div class="gsi-material-button-content-wrapper">
                    <div class="gsi-material-button-icon">
                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" style="display: block;">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                            <path fill="none" d="M0 0h48v48H0z"></path>
                        </svg>
                    </div>
                    <span class="gsi-material-button-contents">Continue with Google</span>
                    <span style="display: none;">Continue with Google</span>
                </div>
            </button>
        </section>

        <section id="board_app_panel" class="hidden">
            <section id="board_editor" class="board_editor hidden">
                <h2 id="board_editor_title">글 작성</h2>
                <textarea id="board_editor_text" maxlength="1000" placeholder="내용을 입력해 주세요."></textarea>
                <label id="board_notice_wrap" class="board_notice_option hidden">
                    <input id="board_notice_checkbox" type="checkbox"/>
                    <span id="board_notice_label">공지사항</span>
                </label>
                <div class="board_editor_meta">
                    <span id="board_editor_count">0 / 1000</span>
                    <div class="board_actions">
                        <button id="board_save_button" class="board_btn primary" type="button">저장</button>
                        <button id="board_cancel_button" class="board_btn" type="button">취소</button>
                    </div>
                </div>
            </section>

            <div id="board_empty" class="board_empty hidden">등록된 글이 없습니다.</div>
            <section id="board_list" class="board_list" aria-live="polite"></section>
            <div id="board_more_wrap" class="board_more_wrap hidden">
                <button id="board_more_button" class="board_btn" type="button">더 보기</button>
            </div>
        </section>
    </main>
