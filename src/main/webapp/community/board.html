    <!--
    TODO : 커뮤니티 게시판 구현
        (전제조건) 이 소스는 Firebase Hosting 에 올라갈 예정이며, 상위 디렉토리의 __ 폴더 안에 Firebase 라이브러리가 자동 배치됨. (init.js 안에 Firebase API로 초기화하는 소스도 자동 생성될 예정)
        (참고자료) Firestore 내 board 컬렉션의 필드 구성
            boardName  (string) - 게시판의 이름으로, 지금은 그냥 board 라고 하드코딩 (추후 다른 목적의 게시판 만들 때 이 값만 다른 값으로 지정해 사용할 예정)
            content    (string) - 글 내용, 1000자까지 입력 허용 예정
            email      (string) - 이메일 (구글 로그인한 계정의 이메일)
            postserial (string) - 글을 식별할 수 있는 고유값 (랜덤하게 생성하나, 절대 겹쳐서는 안됨)
            regdate    (int)    - 글 작성일 (Date 의 time 값으로 지정)
        1. Firebase authentication 으로 로그인 체크, 안되어 있으면 구글 로그인 (shuttingstarsinterface.js 에 일부 구현되어 있음)
        2. 구글 로그인이 되어있으면 바로 글 목록 화면 출력, 맨 상단 우측에는 글 작성 버튼 배치하고, 아래로 글 목록이 출력되어야 함.
           글 목록을 최근 순으로 20개까지 출력, 20개 밑까지 내리면 그다음 20개를 불러오는 방식으로 글 목록 출력
           글은 제목 없이 내용으로만 구성. 개별 글들은 상세페이지 없이, 목록 화면 내에서 글 내용과 수정/삭제 버튼으로 구성.
        
    -->
