    <body>
        <style>
            body {
                margin: 0;
                background: #f6f7fb;
                color: #222;
                font-family: "Noto Sans KR", "Nanum Gothic Coding", sans-serif;
            }
            .admin-shell {
                display: grid;
                grid-template-columns: 260px minmax(0, 1fr);
                min-height: 100vh;
            }
            .admin-menu {
                background: #20242f;
                color: #fff;
                padding: 20px;
            }
            .admin-menu h1 {
                margin: 0 0 18px;
                font-size: 22px;
                font-weight: 700;
            }
            .admin-user {
                margin-bottom: 18px;
                padding-bottom: 18px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.18);
                word-break: break-all;
            }
            .admin-user-email {
                min-height: 22px;
                margin-bottom: 10px;
                font-size: 13px;
                color: #d9dde8;
            }
            .collection-menu {
                display: grid;
                gap: 8px;
            }
            .collection-menu button,
            .admin-user button,
            .admin-login button,
            .row-actions button {
                border-radius: 6px;
            }
            .collection-menu button {
                width: 100%;
                text-align: left;
                color: #f7f8fb;
                background: #303645;
            }
            .collection-menu button.active {
                background: #0f766e;
            }
            .admin-main {
                min-width: 0;
                padding: 24px;
            }
            .admin-toolbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 16px;
            }
            .admin-title {
                margin: 0;
                font-size: 24px;
            }
            .admin-status {
                min-height: 24px;
                margin-bottom: 12px;
                color: #374151;
            }
            .admin-status.error {
                color: #b91c1c;
            }
            .admin-login {
                max-width: 480px;
                margin: 48px auto;
                padding: 24px;
                background: #fff;
                border: 1px solid #dde1eb;
                border-radius: 8px;
                box-shadow: 0 12px 34px rgba(32, 36, 47, 0.08);
            }
            .admin-login h2 {
                margin-top: 0;
            }
            .table-wrap {
                overflow: auto;
                background: #fff;
                border: 1px solid #dde1eb;
                border-radius: 8px;
            }
            .admin-table {
                min-width: 960px;
                width: 100%;
                border-collapse: collapse;
                font-size: 13px;
            }
            .admin-table th,
            .admin-table td {
                vertical-align: top;
                border-bottom: 1px solid #e7eaf1;
                padding: 8px;
            }
            .admin-table th {
                position: sticky;
                top: 0;
                z-index: 1;
                background: #edf1f7;
                text-align: left;
                white-space: nowrap;
            }
            .doc-id {
                max-width: 180px;
                word-break: break-all;
                color: #4b5563;
                font-family: "Nanum Gothic Coding", monospace;
            }
            .cell-editor {
                width: 220px;
                min-height: 38px;
                resize: vertical;
                font-family: "Nanum Gothic Coding", monospace;
                font-size: 12px;
                line-height: 1.45;
            }
            .cell-editor.json {
                min-height: 92px;
            }
            .row-actions {
                display: grid;
                gap: 6px;
                min-width: 84px;
            }
            .empty-state {
                padding: 28px;
                background: #fff;
                border: 1px solid #dde1eb;
                border-radius: 8px;
                color: #4b5563;
            }
            @media (max-width: 760px) {
                .admin-shell {
                    grid-template-columns: 1fr;
                }
                .admin-menu {
                    position: static;
                }
                .admin-toolbar {
                    align-items: flex-start;
                    flex-direction: column;
                }
            }
        </style>
        <div class="admin-shell">
            <aside class="admin-menu">
                <h1>Firestore Admin</h1>
                <div class="admin-user">
                    <div id="admin-user-email" class="admin-user-email">로그인 확인 중...</div>
                    <button id="logout-button" class="pure-button" type="button" disabled hidden>로그아웃</button>

                <nav id="collection-menu" class="collection-menu" aria-label="Firestore collections" hidden></nav>
            </aside>
            <main class="admin-main">
                <section id="login-panel" class="admin-login" hidden>
                    <h2>관리자 로그인</h2>
                    <p>Google 계정으로 로그인해야 Firestore 관리 도구를 사용할 수 있습니다.</p>
                    <button id="login-button" class="gsi-material-button btn_login" type="button">
                        <div class="gsi-material-button-state"></div>
                        <div class="gsi-material-button-content-wrapper">
                            <div class="gsi-material-button-icon">
                                <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:xlink="http://www.w3.org/1999/xlink" style="display: block;">
                                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                                    <path fill="none" d="M0 0h48v48H0z"></path>
                                </svg>
                            </div>
                            <span class="gsi-material-button-contents">Continue with Google</span>
                            <span style="display: none;">Continue with Google</span>
                        </div>
                    </button>
                    <div id="login-status" class="admin-status"></div>
                </section>
                <section id="admin-panel" hidden>
                    <div class="admin-toolbar">
                        <h2 id="collection-title" class="admin-title">컬렉션 선택</h2>
                        <button id="reload-button" class="pure-button pure-button-primary" type="button">다시 불러오기</button>
                    </div>
                    <div id="admin-status" class="admin-status"></div>
                    <div id="table-root"></div>
                </section>
            </main>

        <script type="module">
            import { ShuttingStarsUtility } from '../resources/js/shuttingstarsutils.js';

            document.addEventListener('DOMContentLoaded', () => {
                const ADMIN_EMAIL = 'hujinone11@gmail.com';
                const COLLECTIONS = [
                    { name : 'highscore', label : 'highscore (점수기록)' },
                    { name : 'board', label : 'board (커뮤니티)' },
                    { name : 'additionals', label : 'additionals (추가컨텐츠)' },
                    { name : 'user', label : 'user (사용자)' },
                    { name : 'cloudconfigs', label : 'cloudconfigs (클라우드 설정)' }
                ];
                const FIELD_ORDER = {
                    user : ['date', 'email', 'uid', 'credits'],
                    cloudconfigs : ['uid', 'bonusAvails', 'fontFamily', 'keyList', 'language', 'languageDefault', 'noteSpeedMultiplier'],
                    highscore : ['build', 'clear', 'combo', 'date', 'difficulty', 'email', 'gameover', 'hp', 'level', 'mode', 'notehistory', 'notes', 'point', 'rank', 'report', 'song', 'uid', 'userAgent'],
                    board : ['uid', 'boardName', 'content', 'email', 'notice', 'postserial', 'regdate'],
                    additionals : ['uid', 'contentname', 'date', 'type', 'url']
                };

                let backend = null;
                const loginPanel = document.getElementById('login-panel');
                const adminPanel = document.getElementById('admin-panel');
                const loginButton = document.getElementById('login-button');
                const logoutButton = document.getElementById('logout-button');
                const reloadButton = document.getElementById('reload-button');
                const userEmail = document.getElementById('admin-user-email');
                const collectionMenu = document.getElementById('collection-menu');
                const collectionTitle = document.getElementById('collection-title');
                const loginStatus = document.getElementById('login-status');
                const statusBox = document.getElementById('admin-status');
                const tableRoot = document.getElementById('table-root');
                let selectedCollection = COLLECTIONS[0].name;
                let busy = false;

                const setBusy = (value) => {
                    busy = value;
                    loginButton.disabled = value;
                    logoutButton.disabled = value || !isAdminUser();
                    reloadButton.disabled = value || !isAdminUser();
                    collectionMenu.querySelectorAll('button').forEach((button) => { button.disabled = value || !isAdminUser(); });
                };

                const setStatus = (message, error) => {
                    loginStatus.textContent = message || '';
                    loginStatus.classList.toggle('error', !!error);
                    statusBox.textContent = message || '';
                    statusBox.classList.toggle('error', !!error);
                };

                const isAdminUser = () => {
                    return !!(backend && backend.user && backend.user.email === ADMIN_EMAIL);
                };

                const renderSideMenu = (adminAvailable) => {
                    logoutButton.hidden = !adminAvailable;
                    collectionMenu.hidden = !adminAvailable;
                    logoutButton.disabled = busy || !adminAvailable;
                    collectionMenu.querySelectorAll('button').forEach((button) => {
                        button.disabled = busy || !adminAvailable;
                    });
                };

                const isFirebaseUsable = () => {
                    return ShuttingStarsUtility.detectFirebaseInitialized()
                        && typeof(firebase) != 'undefined'
                        && typeof(firebase.auth) == 'function'
                        && typeof(firebase.firestore) == 'function';
                };

                const refreshBackend = async () => {
                    if(!isFirebaseUsable()) {
                        backend = null;
                        return false;
                    }
                    try {
                        const backendModule = await import('../resources/js/shuttingstarsinterface.js');
                        backend = backendModule.default;
                    } catch(e) {
                        console.error(e);
                        backend = null;
                    }
                    return !!(backend && backend.auth != null && backend.firestore != null);
                };

                const renderLoggedOut = (message, error) => {
                    loginPanel.hidden = false;
                    adminPanel.hidden = true;
                    userEmail.textContent = '로그인 필요';
                    renderSideMenu(false);
                    tableRoot.textContent = '';
                    setStatus(message || '', !!error);
                    setBusy(false);
                };

                const stringifyValue = (value) => {
                    if(value === null) return 'null';
                    if(typeof(value) == 'undefined') return '';
                    if(typeof(value) == 'object') return JSON.stringify(value, null, 2);
                    return String(value);
                };

                const parseValue = (rawValue, originalValue) => {
                    const text = rawValue.trim();
                    if(originalValue === null) {
                        if(text === '' || text === 'null') return null;
                        return ShuttingStarsUtility.parseJSON(text);
                    }
                    if(Array.isArray(originalValue) || typeof(originalValue) == 'object') {
                        return text === '' ? null : ShuttingStarsUtility.parseJSON(text);
                    }
                    if(typeof(originalValue) == 'number') {
                        if(text === '') return null;
                        const parsed = Number(text);
                        if(Number.isNaN(parsed)) throw new Error('숫자 형식이 아닙니다: ' + rawValue);
                        return parsed;
                    }
                    if(typeof(originalValue) == 'boolean') {
                        if(text === 'true') return true;
                        if(text === 'false') return false;
                        throw new Error('boolean 값은 true 또는 false 로 입력해야 합니다.');
                    }
                    return rawValue;
                };

                const createCollectionMenu = () => {
                    collectionMenu.textContent = '';
                    COLLECTIONS.forEach((collection) => {
                        const button = document.createElement('button');
                        button.className = 'pure-button';
                        button.type = 'button';
                        button.textContent = collection.label;
                        button.dataset.collection = collection.name;
                        button.addEventListener('click', () => {
                            selectedCollection = collection.name;
                            loadCollection();
                        });
                        collectionMenu.appendChild(button);
                    });
                };

                const renderAuthState = async () => {
                    if(isAdminUser()) {
                        loginPanel.hidden = true;
                        adminPanel.hidden = false;
                        userEmail.textContent = backend.user.email;
                        renderSideMenu(true);
                        await loadCollection();
                    } else {
                        renderLoggedOut('', false);
                        return;
                    }
                    setBusy(false);
                };

                const rejectNonAdmin = async () => {
                    if(backend && backend.user && backend.user.email && backend.user.email !== ADMIN_EMAIL) {
                        const email = backend.user.email;
                        await backend.logout();
                        alert('관리자 계정만 사용할 수 있습니다. 현재 계정: ' + email);
                    }
                };

                const checkLogin = async () => {
                    setBusy(true);
                    setStatus('');
                    try {
                        if(!await refreshBackend()) {
                            renderLoggedOut('', false);
                            return;
                        }
                        await backend.checkLogined();
                        await rejectNonAdmin();
                        await renderAuthState();
                    } catch(e) {
                        console.error(e);
                        setStatus('로그인 상태 확인 실패: ' + e, true);
                        setBusy(false);
                    }
                };

                const collectColumns = (rows) => {
                    const fields = new Set(FIELD_ORDER[selectedCollection] || []);
                    rows.forEach((row) => {
                        Object.keys(row.data).forEach((key) => { fields.add(key); });
                    });
                    return Array.from(fields);
                };

                const renderTable = (snapshot) => {
                    const rows = snapshot.docs.map((doc) => {
                        return { id : doc.id, ref : doc.ref, data : doc.data() };
                    });
                    if(rows.length <= 0) {
                        tableRoot.innerHTML = '<div class="empty-state">문서가 없습니다.</div>';
                        return;
                    }

                    const columns = collectColumns(rows);
                    const wrap = document.createElement('div');
                    const table = document.createElement('table');
                    const thead = document.createElement('thead');
                    const tbody = document.createElement('tbody');
                    const headRow = document.createElement('tr');
                    wrap.className = 'table-wrap';
                    table.className = 'admin-table';

                    ['문서 ID'].concat(columns).concat(['작업']).forEach((label) => {
                        const th = document.createElement('th');
                        th.textContent = label;
                        headRow.appendChild(th);
                    });
                    thead.appendChild(headRow);

                    rows.forEach((row) => {
                        const tr = document.createElement('tr');
                        const idCell = document.createElement('td');
                        idCell.className = 'doc-id';
                        idCell.textContent = row.id;
                        tr.appendChild(idCell);

                        columns.forEach((column) => {
                            const value = row.data[column];
                            const td = document.createElement('td');
                            const textarea = document.createElement('textarea');
                            textarea.className = 'cell-editor';
                            textarea.dataset.field = column;
                            textarea.value = stringifyValue(value);
                            if(value !== null && typeof(value) == 'object') textarea.classList.add('json');
                            td.appendChild(textarea);
                            tr.appendChild(td);
                        });

                        const actionCell = document.createElement('td');
                        const actions = document.createElement('div');
                        const saveButton = document.createElement('button');
                        const deleteButton = document.createElement('button');
                        actions.className = 'row-actions';
                        saveButton.className = 'pure-button pure-button-primary';
                        saveButton.type = 'button';
                        saveButton.textContent = '저장';
                        saveButton.addEventListener('click', () => saveRow(row, columns, tr));
                        deleteButton.className = 'pure-button';
                        deleteButton.type = 'button';
                        deleteButton.textContent = '삭제';
                        deleteButton.addEventListener('click', () => deleteRow(row));
                        actions.appendChild(saveButton);
                        actions.appendChild(deleteButton);
                        actionCell.appendChild(actions);
                        tr.appendChild(actionCell);
                        tbody.appendChild(tr);
                    });

                    table.appendChild(thead);
                    table.appendChild(tbody);
                    wrap.appendChild(table);
                    tableRoot.textContent = '';
                    tableRoot.appendChild(wrap);
                };

                const loadCollection = async () => {
                    if(!isAdminUser()) return;
                    setBusy(true);
                    setStatus('불러오는 중...');
                    try {
                        const menuButtons = collectionMenu.querySelectorAll('button');
                        menuButtons.forEach((button) => {
                            button.classList.toggle('active', button.dataset.collection === selectedCollection);
                        });
                        const selected = COLLECTIONS.find((item) => item.name === selectedCollection);
                        collectionTitle.textContent = selected ? selected.label : selectedCollection;
                        const snapshot = await backend.firestore.collection(selectedCollection).get();
                        renderTable(snapshot);
                        setStatus(snapshot.size + '개 문서를 불러왔습니다.');
                    } catch(e) {
                        console.error(e);
                        setStatus('컬렉션을 불러오지 못했습니다: ' + e, true);
                    } finally {
                        setBusy(false);
                    }
                };

                const saveRow = async (row, columns, tr) => {
                    if(!isAdminUser() || busy) return;
                    setBusy(true);
                    setStatus('저장 중...');
                    try {
                        const updateData = {};
                        columns.forEach((column) => {
                            const editor = tr.querySelector('[data-field="' + column + '"]');
                            if(typeof(row.data[column]) == 'undefined' && editor.value.trim() === '') return;
                            updateData[column] = parseValue(editor.value, row.data[column]);
                        });
                        await row.ref.update(updateData);
                        setStatus('저장했습니다. 목록을 다시 불러옵니다.');
                        await loadCollection();
                    } catch(e) {
                        console.error(e);
                        setStatus('저장 실패: ' + e.message, true);
                        setBusy(false);
                    }
                };

                const deleteRow = async (row) => {
                    if(!isAdminUser() || busy) return;
                    if(!confirm('문서 "' + row.id + '" 를 삭제할까요?')) return;
                    setBusy(true);
                    setStatus('삭제 중...');
                    try {
                        await row.ref.delete();
                        setStatus('삭제했습니다. 목록을 다시 불러옵니다.');
                        await loadCollection();
                    } catch(e) {
                        console.error(e);
                        setStatus('삭제 실패: ' + e, true);
                        setBusy(false);
                    }
                };

                loginButton.addEventListener('click', async () => {
                    setBusy(true);
                    setStatus('');
                    try {
                        if(!await refreshBackend()) {
                            renderLoggedOut('Firebase를 사용할 수 없습니다. 잠시 후 다시 시도하거나 Firebase 호스팅 환경에서 접속해 주세요.', true);
                            return;
                        }
                        await backend.openGoogleLogin();
                        await rejectNonAdmin();
                        await renderAuthState();
                    } catch(e) {
                        console.error(e);
                        setStatus('로그인 실패: ' + e, true);
                        setBusy(false);
                    }
                });
                logoutButton.addEventListener('click', async () => {
                    setBusy(true);
                    try {
                        await backend.logout();
                        await renderAuthState();
                    } catch(e) {
                        console.error(e);
                        setStatus('로그아웃 실패: ' + e, true);
                        setBusy(false);
                    }
                });
                reloadButton.addEventListener('click', loadCollection);
                createCollectionMenu();
                checkLogin();
            });
        </script>
