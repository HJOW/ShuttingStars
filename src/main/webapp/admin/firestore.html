        <!--  
        TODO
           Firestore DB 관리용 도구 페이지를 이 곳에 만들 예정
           1. 구글 로그인 (Firebase auth 사용) 해야 사용 가능하며, 계정 이메일이 hujinone11@gmail.com 이어야 사용 가능 (그외의 경우 자동 로그아웃 후 안내 메시지)
           2. Firestore 컬렉션 'highscore' (점수기록), 'board' (커뮤니티), 'additionals' (추가컨텐츠), 'user' (사용자), 'cloudconfigs' (클라우드 설정) 들을 화면 상의 메뉴로 띄워야 함
              그외, 메뉴 상에, 현재 로그인한 사용자 email 주소와 로그아웃 버튼도 있어야 함
           3. 메뉴에서 컬렉션을 클릭하면, 화면 중앙에 테이블 형태로 출력
              해당 행, 해당 셀에 출력될 데이터가 배열이거나 객체이면, 그 셀 안에서는 JSON 형식으로 출력
              각각의 셀은 텍스트필드로, 데이터를 보는 것 뿐만 아니라 값 수정도 가능해야 함 (수정 완료 후 저장은 4번 참고)
           4. 마지막 행에는 데이터를 수정/삭제할 수 있는 버튼을 배치. 
              수정 시 해당 행의 데이터의 수정 사항 (3번 참고) 을 반영, 삭제 시 해당 행 데이터 실제 삭제
              둘 모두 작업 완료 후 목록 데이터를 다시 불러와야 함

           각 컬렉션별 문서 구조 (필드)
              user
                  date  (number) 등록일자 (milliseconds)
                  email (string) 사용자 계정 이메일 주소
                  uid   (string) 사용자 UID (Firebase Auth UID)
                  credits (object) 사용자 게임 데이터
                      PERFECT (number) 누적 PERFECT 수
                      GREAT (number)   누적 GREAT 수
                      GOOD (number)    누적 GOOD 수
                      BAD (number)     누적 BAD 수
                      MISS (number)    누적 MISS 수
                      maxCombo (number) 누적 최대 콤보 수
                      playCount (number) 누적 플레이 횟수
                      used (number) 상품 구매 횟수
                      antiMatter (number) 반물질 (재화) 보유 수
                      darkMatter (number) 암흑물질 (재화) 보유 수
                      hashKey (string)  해시값 (유효성 검사에 사용)
              cloudconfigs
                  uid (string) 사용자 UID (Firebase Auth UID)
                  bonusAvails (array<string>) 사용자가 활성화한 보너스 컨텐츠명 목록
                  fontFamily (string) 글꼴 (사용자가 선택)
                  keyList (array<string>) 입력키 설정값 (6개)
                  language (string) 언어 설정
                  languageDefault (boolean) 언어 설정 브라우저의 기본값 사용여부
                  noteSpeedMultiplier (number) 노트 속도 배율 (사용자 설정)
              highscore
                  build (number) 빌드 (버전 번호)
                  clear (boolean) 클리어 여부
                  combo (number) 최대 콤보 수
                  date (number) 등록일자 (milliseconds)
                  difficulty (string) 난이도 (명칭)
                  email (string) 사용자 계정 이메일 주소
                  gameover (boolean) 게임오버 여부
                  hp (number) 게임 종료 시점에 남은 HP
                  level (number) 난이도 (숫자)
                  mode (string) 모드 (default, mission, mysong, ...)
                  notehistory (array<object>) 노트 처리 이력 (아직 미사용)
                      현재 자식 필드 없음
                  notes (number) 노트 수
                  point (number) 획득 점수
                  rank (string) 획득 등급 (S, A, B, C, D, F)
                  report (object) 결과 (각 획득 판정 수)
                      PERFECT (number)
                      GREAT (number)
                      GOOD (number)
                      BAD (number)
                      MISS (number)
                  song (object) 곡 정보
                      bpm (number) 곡의 BPM
                      composer (string) 곡의 작곡가
                      name (string) 곡 이름 (제목)
                      noteWriter (string) 곡의 노트 작성자
                      serial (string) 고유값
                  uid (string) 사용자 UID (Firebase Auth UID)
                  userAgent (string) 사용자의 브라우저의 User-Agent 문자열
              board
                  uid (string) 사용자 UID (Firebase Auth UID)
                  boardName (string) 게시판 이름
                  content (string) 게시글 내용
                  email (string) 사용자의 이메일 주소
                  notice (boolean) 공지글 여부
                  postserial (string) 게시글 고유값
                  regdate (number) 등록일자 (milliseconds)
              additionals
                  uid (string) 사용자 UID (Firebase Auth UID)
                  contentname (string) 컨텐츠명
                  date (number) 등록일자 (milliseconds)
                  type (string) 유형
                  url (string) 컨텐츠 URL

        -->
    </body>
